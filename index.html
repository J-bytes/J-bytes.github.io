<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jonathan — Portfolio</title>
  <meta name="description" content="Personal portfolio: about, resume and projects.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="nav">
    <a class="brand" href="#top" id="brand"></a>
    <nav>
      <a href="#projects">Projects</a>
      <a href="#earlier">Earlier work</a>
      <a href="#about">About</a>
      <a href="#resume">Resume</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <p class="eyebrow" id="hero-role"></p>
      <h1 id="hero-name"></h1>
      <p class="lede" id="hero-tagline"></p>
      <div class="cta">
        <a class="btn primary" href="#projects">See projects</a>
        <a class="btn" href="#resume">Resume</a>
      </div>
    </section>

    <section id="projects">
      <h2>Projects</h2>
      <div id="project-featured" class="featured"></div>
      <div id="project-grid" class="grid"></div>
    </section>

    <section id="earlier">
      <h2>Earlier work</h2>
      <p class="sub">Research, coursework and smaller projects.</p>
      <div id="earlier-grid" class="grid compact"></div>
    </section>

    <section id="about">
      <h2>About</h2>
      <div id="about-body" class="prose"></div>
    </section>

    <section id="resume">
      <div class="resume-head">
        <h2>Resume</h2>
        <a class="btn" href="resume.pdf" download>Download PDF</a>
      </div>
      <details open>
        <summary>Experience</summary>
        <div id="experience" class="timeline"></div>
      </details>
      <details>
        <summary>Education</summary>
        <div id="education" class="timeline"></div>
      </details>
      <details>
        <summary>Skills</summary>
        <div id="skills" class="skills"></div>
      </details>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <p>Want to work together or just say hi?</p>
      <ul id="contact-links" class="links"></ul>
    </section>
  </main>

  <footer><span id="year"></span> · Built by hand, no frameworks.</footer>

  <script src="content.js"></script>
  <script src="main.js"></script>
</body>
</html>
